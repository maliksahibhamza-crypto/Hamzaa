<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task & Chat Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container" id="loginCard">
        <h2>Welcome Back</h2>
        <div id="login-error" style="color: red; font-size: 13px; margin-bottom: 10px; text-align: center;"></div>
        <form id="loginForm" onsubmit="return false;">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    <i class="fa-regular fa-eye toggle-password" id="eyeIcon"></i>
                </div>
            </div>
            <button type="button" class="login-btn" id="loginBtn">Log In</button>
        </form>
        <div class="extra-options">
            <a id="goToForgot">Forgot Password?</a>
            <a id="goToSignUp">Sign Up</a>
        </div>
    </div>

    <div class="login-container hidden" id="signUpCard">
        <h2>Create Account</h2>
        <div id="signup-error" style="color: red; font-size: 13px; margin-bottom: 10px; text-align: center;"></div>
        <form id="signUpForm" onsubmit="return false;">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter your full name" required>
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="Choose unique username" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                    <i class="fa-regular fa-eye toggle-password" id="regEyeIcon"></i>
                </div>
            </div>
            <button type="button" class="login-btn" id="signUpBtn">Sign Up</button>
        </form>
        <div class="back-to-login">Already have an account? <a id="backToLogin">Log In</a></div>
    </div>

    <div class="login-container hidden" id="forgotCard">
        <h2>Reset Password</h2>
        <form id="forgotForm" onsubmit="return false;">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="forgotEmail" placeholder="Enter your registered email" required>
            </div>
            <button type="button" class="login-btn" id="forgotBtn">Reset Password</button>
        </form>
        <div class="back-to-login">Back to <a id="backToLoginFromForgot">Log In</a></div>
    </div>

    <div class="dashboard-container hidden" id="dashboardCard">
        </div>

    <script type="module" src="app.js"></script>
</body>
    </html>
